name: Tivano
options:
  bundleIdPrefix: dev.tivano
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
settings:
  base:
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Tivano:
    type: application
    platform: macOS
    configFiles:
      Debug: config/dev.xcconfig
      Release: config/release.xcconfig
    sources:
      - path: Tivano
        type: syncedFolder
      # The license, the third-party notices and the trademark policy travel with every copy of
      # the app; About shows them under Licenses.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: TRADEMARK.md
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - target: TivanoCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: "Tivano"
        PRODUCT_MODULE_NAME: Tivano
        PRODUCT_BUNDLE_IDENTIFIER: dev.tivano.Tivano
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tivano"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Jordy Spruit (Droppy). Tivano is based on Droppy Code by Jordy Spruit (Droppy), https://getdroppycode.app. GNU AGPL v3.0 with additional attribution terms."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Tivano uses your microphone only when you start a voice session. Your audio is sent to OpenAI through your own ChatGPT-signed-in Codex."
        CODE_SIGN_STYLE: Automatic
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        DEAD_CODE_STRIPPING: YES
        SWIFT_OBJC_BRIDGING_HEADER: Tivano/App/Window/Tivano-Bridging-Header.h
      configs:
        Debug:
          PRODUCT_NAME: "Tivano Dev"
          PRODUCT_BUNDLE_IDENTIFIER: dev.tivano.Tivano.dev
          INFOPLIST_KEY_CFBundleDisplayName: "Tivano Dev"
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_ENTITLEMENTS: config/release.entitlements
  TivanoCLI:
    type: tool
    platform: macOS
    configFiles:
      Debug: config/dev.xcconfig
      Release: config/release.xcconfig
    sources:
      - path: TivanoCLI
      - path: Tivano/Core/Models/LocalControl.swift
      - path: Tivano/Services/Control/ControlSocket.swift
      - path: Tivano/Services/Control/ControlClient.swift
    settings:
      base:
        PRODUCT_NAME: tivano-control
        PRODUCT_MODULE_NAME: TivanoCLI
        PRODUCT_BUNDLE_IDENTIFIER: dev.tivano.Tivano.CLI
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Developer ID Application
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        SKIP_INSTALL: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.tivano.Tivano.CLI.dev
