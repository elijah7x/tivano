# HTTP context. Only the dedicated mirror locations consume these zones.
# Verified against nginx.org/en/docs/http/ngx_http_limit_conn_module.html:
# HTTP/2 streams count separately; per-IP and whole-vhost limits combine.
limit_conn_zone $binary_remote_addr zone=tivano_perip:1m;
limit_conn_zone $server_name zone=tivano_downloads:1m;
limit_req_zone $binary_remote_addr zone=tivano_requests:1m rate=2r/s;
log_format tivano_mirror '$time_iso8601 $status $body_bytes_sent $request_time '
                         '$limit_req_status $limit_conn_status';
