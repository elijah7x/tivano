# Included only in elijah.ac.cn's HTTPS server. No SPA fallback or directory listing.
# The outer prefix prevents unrelated main-site regex locations from handling mirror paths.
location ^~ /tivano/ {
location = /tivano/updates.json {
    if (-f /var/www/tivano/.disabled) { return 503; }
    root /var/www;
    try_files $uri =404;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    limit_req zone=tivano_requests burst=10 nodelay;
    limit_req_status 429;
    limit_conn tivano_perip 8;
    limit_conn_status 429;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/tivano-mirror.log tivano_mirror;
}
location ~ ^/tivano/releases/(v[0-9]+\.[0-9]+\.[0-9]+)/Tivano-([0-9]+\.[0-9]+\.[0-9]+)\.dmg$ {
    if (-f /var/www/tivano/.disabled) { return 503; }
    root /var/www;
    try_files $uri =404;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    limit_req zone=tivano_requests burst=10 nodelay;
    limit_req_status 429;
    limit_conn tivano_perip 4;
    limit_conn tivano_downloads 8;
    limit_conn_status 429;
    # 8 concurrent requests x 512 KiB/s ~= 32 Mib/s of payload, not a packet-level cap.
    # Keep rate_after at zero; HTTP/2 streams and Range requests each consume a slot.
    limit_rate 512k;
    limit_rate_after 0;
    max_ranges 1;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Disposition "attachment";
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/tivano-mirror.log tivano_mirror;
}
location /tivano/ {
    return 404;
    access_log /var/log/nginx/tivano-mirror.log tivano_mirror;
}
}
